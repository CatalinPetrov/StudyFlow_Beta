<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="StudyFlow: organizează materiile, orarul, taskurile, examenele și sesiunile de învățare într-un singur loc." />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudyFlow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StudyFlow — Planner universitar</title>
    <script>
      try {
        const saved = localStorage.getItem('studyflow-theme')
        const preference = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system'
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        const resolved = dark ? 'dark' : 'light'
        const root = document.documentElement
        root.dataset.theme = resolved
        root.style.colorScheme = resolved
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.content = dark ? '#0b0b0c' : '#f5f5f7'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
